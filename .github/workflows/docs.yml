name: Documentation

# Builds the Doxygen documentation and publishes it to GitHub Pages.
# The generated html/ is therefore no longer kept in the repository.

on:
  push:
    branches: [master]
    paths:
      - '**.cpp'
      - '**.hpp'
      - '**.h'
      - 'Doxyfile'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # graphviz is not needed while HAVE_DOT is NO, but keeps the workflow
      # working should the Doxyfile ever switch it on.
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz
          doxygen --version

      - name: Generate documentation
        run: |
          doxygen Doxyfile
          test -f html/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
